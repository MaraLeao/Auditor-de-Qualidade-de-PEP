[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "services/worker"]   # `data_extract` e `tests` na raiz; o pacote `worker` em services/worker

[tool.ruff]
line-length = 120
target-version = "py313"
src = [".", "services/worker"]   # `worker` é um pacote do projeto, não de terceiros
extend-exclude = ["evaluation", ".claude", "services/worker/venv", "services/producer/node_modules", "apps/web/node_modules"]

[tool.ruff.lint]
# E/W: estilo · F: erros e imports/variáveis não usados · I: ordem dos imports · B: armadilhas comuns
select = ["E", "W", "F", "I", "B"]
ignore = [
    "E501",   # linhas longas: as regras de auditoria têm listas de termos extensas (F1 não reformata)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]   # re-exports da API do pacote
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true       # modo gradual: nada de strict por enquanto
warn_unused_ignores = true
files = ["data_extract", "services/worker/worker"]
mypy_path = ".:services/worker"
namespace_packages = true
explicit_package_bases = true   # data_extract/ e worker/ não têm __init__.py
exclude = ["services/worker/venv"]
