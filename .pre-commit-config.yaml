# Instalação:  pip install -r requirements-dev.txt && pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff            # lint (regras em pyproject.toml)
        args: [--fix]
        files: ^(data_extract|worker|tests)/
  - repo: local
    hooks:
      - id: mypy
        name: mypy (modo gradual)
        entry: mypy
        language: system
        pass_filenames: false
        files: ^(data_extract|worker)/.*\.py$
      - id: pytest
        name: pytest
        entry: python -m pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]
