name: auditor-pep

services:
  redis:
    container_name: auditor-pep-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --save 60 1
    restart: unless-stopped

  worker:
    container_name: auditor-pep-worker
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - PYTHONUNBUFFERED=1
      - LMSTUDIO_URL=http://host.docker.internal:1234/api/v1/chat
      - SQLITE_DB_PATH=/app/data/auditor.db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - audit-data:/app/data
      - ./data_extract:/app/data_extract
    restart: unless-stopped

  producer:
    container_name: auditor-pep-producer
    build: ./services/producer
    ports:
      - "3001:3001"
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379
      - SQLITE_DB_PATH=/app/data/auditor.db
    volumes:
      - audit-data:/app/data
    restart: unless-stopped

volumes:
  audit-data: