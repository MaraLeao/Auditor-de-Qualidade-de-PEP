services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1

  worker:
    build: ./worker
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
    restart: unless-stopped

volumes:
  redis_data: